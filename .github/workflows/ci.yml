name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build ControleFinanceiro.slnx --nologo

      # Sai com código 1 se o modelo do EF mudou sem migration. O dotnet-ef vem de
      # dotnet-tools.json, na mesma versão do EF do projeto, e não precisa de banco.
      - name: Modelo do EF sem migration pendente
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/ControleFinanceiro.Infrastructure.Persistence --no-build

      # Domain.Tests fica de fora porque roda no passo seguinte, com cobertura.
      - name: Testes de unidade
        run: dotnet test ControleFinanceiro.slnx --no-build --nologo --filter "FullyQualifiedName!~ControleFinanceiro.WebApi.Tests&FullyQualifiedName!~ControleFinanceiro.Mcp.Tests&FullyQualifiedName!~ControleFinanceiro.Domain.Tests"

      # Falha abaixo do mínimo definido em ControleFinanceiro.Domain.Tests.csproj.
      - name: Testes do domínio com cobertura mínima
        run: dotnet test tests/ControleFinanceiro.Domain.Tests --no-build --nologo -p:CollectCoverage=true -p:CoverletOutput="${{ runner.temp }}/cobertura-dominio/"

      # Suíte completa, com Postgres do Testcontainers: o ubuntu-latest já tem Docker.
      - name: Testes de integração
        run: dotnet test tests/ControleFinanceiro.WebApi.Tests --no-build --nologo

      # Sobe o processo real do servidor, com Postgres do Testcontainers.
      - name: Testes do servidor MCP
        run: dotnet test tests/ControleFinanceiro.Mcp.Tests --no-build --nologo

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Testes do guardrail
        run: node --test scripts/harness/guardrail.test.mjs

      - name: Testes do script de testes afetados
        run: node --test scripts/harness/testes-afetados.test.mjs

      - name: Varredura de dados financeiros e secrets
        if: github.event_name == 'pull_request'
        run: sh .githooks/scan-staged.sh --branch "origin/${{ github.base_ref }}"
